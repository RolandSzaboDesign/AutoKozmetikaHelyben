<footer class='site-footer'>
  <div class='container site-footer__inner'>
    <p>
      {{ site.title }}
      · Szabó Roland
    </p>
    <nav class='site-footer__links' aria-label='Lábléc'>
      <a href='/szolgaltatasok/'>Szolgáltatások</a>
      <a href='{% if page.url == '/' or serviceKey or hasContact %}#kapcsolat{% else %}/#kapcsolat{% endif %}'>
        Kapcsolat
      </a>
      <a href='/adatkezeles/'> Adatkezelés </a>
      <a href='{{ site.contact.instagram }}'> Instagram </a>
    </nav>
    <p class='site-footer__copyright'>© 2026</p>
    <nav class='site-footer__areas' aria-label='Kiszállási területek'>
      <span>Kiszállási területek</span>
      {% for area in locationPages %}
        <a href='{{ area.url }}'>{{ area.label | escape }}</a>
      {% endfor %}
      <a href='/kiszallasi-teruletek/'>Összes kiszállási terület</a>
    </nav>
  </div>
</footer>
