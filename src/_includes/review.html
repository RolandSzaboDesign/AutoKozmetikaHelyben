<blockquote class='review'>
  <div class='review__stars' role='img' aria-label='5 csillag az 5-ből'>
    <span aria-hidden='true'> ★★★★★ </span>
  </div>
  <p><span class='review__full'>„{{ item.text | strip | escape }}”</span><span class='review__short'>„{{ item.shortText | strip | escape }}”</span></p>
  <footer>
    <strong>
      {{ item.author | escape }}
    </strong>
    <span>
      Google-értékelés{% if item.text != item.fullText %} · részlet{% endif %}
    </span>
  </footer>
</blockquote>
