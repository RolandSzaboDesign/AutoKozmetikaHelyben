<!DOCTYPE html>
<html lang="{{ site.lang }}">
	<head>
		<meta charset="utf-8">
		<title>
			{{ title | default: site.homepage_title }}
		</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="{{ description | default: site.description_short }}">
		<meta name="author" content="{{ site.author.name }}">
		<meta name="robots" content="{{ robots | default: 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1' }}">
		<meta name="theme-color" content="#ffffff">
		<link rel="canonical" href="{{ site.url }}{{ page.url }}">
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
		<link rel="manifest" href="/assets/favicons/site.webmanifest">
		<link rel="mask-icon" href="/assets/favicons/safari-pinned-tab.svg" color="#087f83">
		<link rel="shortcut icon" href="/favicon.ico">
		<meta name="msapplication-TileColor" content="#087f83">
		<link rel="preload" href="/assets/fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin>
		<link rel="preload" href="/assets/fonts/fraunces-variable.ttf" as="font" type="font/ttf" crossorigin>
		<link rel="stylesheet" href="/assets/css/style.css">
		<script src="/assets/js/analytics.js" defer></script>
		<script src="/assets/js/main.js" defer>
		</script>
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="{{ site.title }}">
		<meta property="og:url" content="{{ site.url }}{{ page.url }}">
		<meta property="og:locale" content="{{ site.locale }}">
		<meta property="og:title" content="{{ title | default: site.homepage_title }}">
		<meta property="og:description" content="{{ description | default: site.description_long }}">
		<meta property="og:image" content="{{ site.url }}{{ og_image | default: site.ogImage }}">
		<meta property="og:image:width" content="1200">
		<meta property="og:image:height" content="630">
		<meta property="og:image:alt" content="{{ og_image_alt | default: site.ogImageAlt }}">
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="{{ title | default: site.homepage_title }}">
		<meta name="twitter:description" content="{{ description | default: site.description_long }}">
		<meta name="twitter:image" content="{{ site.url }}{{ og_image | default: site.ogImage }}">
		{% unless isLocalPreview %}
			<script src="https://analytics.ahrefs.com/analytics.js" data-key="nXXk1y0Fw22OT7lRCMDrYA" async>
			</script>
		{% endunless %}
	</head>
	<body>
		<a class="skip-link" href="#tartalom">
			Ugrás a tartalomra
		</a>
		<header class="site-header">
			<div class="container site-header__inner">
				<a class="brand" href="/" aria-label="{{ site.title }} – főoldal">
					Autókozmetika
					<span>
						a XXII. kerületben
					</span>
				</a>
				<div class="site-header__actions">
					<a class="site-header__phone" href="{{ site.contact.telephoneHref }}" aria-label="Hívj: {{ site.author.telephone }}">
						<svg class="phone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L9 11a16 16 0 0 0 4 4l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/>
						</svg>
						<span class="phone-number">
							{{ site.author.telephone }}
						</span>
					</a>
					<a class="button button--small" href="{% if page.url == '/' %}#kapcsolat{% else %}/#kapcsolat{% endif %}">
						Visszahívást kérek
						<span aria-hidden="true">
							↗
						</span>
					</a>
				</div>
			</div>
		</header>
		{{ content }}
		<footer class="site-footer">
			<div class="container site-footer__inner">
				<p>
					{{ site.title }}
					· Szabó Roland
				</p>
				<nav class="site-footer__links" aria-label="Lábléc">
					<a href="{% if page.url == '/' %}#kapcsolat{% else %}/#kapcsolat{% endif %}">
						Kapcsolat
					</a>
					<a href="/adatkezeles/">
						Adatkezelés
					</a>
					<a href="{{ site.contact.instagram }}">
						Instagram
					</a>
				</nav>
				<p class="site-footer__copyright">
					© 2026
				</p>
			</div>
		</footer>
	</body>
</html>
