<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ title | default: site.homepage_title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ description | default: site.description_short }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="robots" content="{{ robots | default: 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1' }}">
  <meta name="theme-color" content="#f7f5ef">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/main.js" defer></script>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:locale" content="{{ site.locale }}">
  <meta property="og:title" content="{{ title | default: site.homepage_title }}">
  <meta property="og:description" content="{{ description | default: site.description_long }}">
  {% if og_image %}<meta property="og:image" content="{{ site.url }}{{ og_image }}">{% endif %}

  <script src="https://analytics.ahrefs.com/analytics.js" data-key="nXXk1y0Fw22OT7lRCMDrYA" async></script>
</head>
<body>
  <a class="skip-link" href="#tartalom">Ugrás a tartalomra</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/" aria-label="{{ site.homepage_title }} – főoldal">{{ site.homepage_title }}</a>
      <div class="site-header__actions">
        <a class="site-header__phone" href="{{ site.contact.telephoneHref }}">{{ site.author.telephone }}</a>
        <a class="button button--small" href="/#kapcsolat"><span class="button__long">Ingyenes felmérés</span><span class="button__short">Felmérés</span></a>
      </div>
    </div>
  </header>

  {{ content }}
</body>
</html>
