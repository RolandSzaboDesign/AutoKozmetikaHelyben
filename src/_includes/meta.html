<meta charset='utf-8'>
<title>
  {{ title | default: site.homepage_title | escape }}
</title>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<meta name='description' content='{{ description | default: site.description_short | escape }}'>
<meta name='author' content='{{ site.author.name | escape }}'>
<meta
  name='robots'
  content='{{ robots | default: 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1' }}'
>
<meta name='theme-color' content='#ffffff'>
<link rel='canonical' href='{{ site.url }}{{ page.url }}'>
<link rel='apple-touch-icon' sizes='180x180' href='/assets/favicons/apple-touch-icon.png'>
<link rel='icon' type='image/png' sizes='32x32' href='/assets/favicons/favicon-32x32.png'>
<link rel='icon' type='image/png' sizes='16x16' href='/assets/favicons/favicon-16x16.png'>
<link rel='manifest' href='/assets/favicons/site.webmanifest'>
<link rel='mask-icon' href='/assets/favicons/safari-pinned-tab.svg' color='#087f83'>
<link rel='shortcut icon' href='/favicon.ico'>
<meta name='msapplication-TileColor' content='#087f83'>
<link rel='preload' href='/assets/fonts/manrope-variable.ttf' as='font' type='font/ttf' crossorigin>
<link rel='preload' href='/assets/fonts/fraunces-variable.ttf' as='font' type='font/ttf' crossorigin>
<link rel='stylesheet' href='/assets/css/style.css'>
<script src='/assets/js/analytics.js' defer></script>
<script src='/assets/js/main.js' defer></script>
<script src='/assets/js/gallery.js' defer></script>
<script src='/assets/js/forms.js' defer></script>
<meta property='og:type' content='website'>
<meta property='og:site_name' content='{{ site.title }}'>
<meta property='og:url' content='{{ site.url }}{{ page.url }}'>
<meta property='og:locale' content='{{ site.locale }}'>
<meta property='og:title' content='{{ title | default: site.homepage_title | escape }}'>
<meta property='og:description' content='{{ description | default: site.description_long | escape }}'>
<meta property='og:image' content='{{ site.url }}{{ og_image | default: site.ogImage }}'>
<meta property='og:image:width' content='1200'>
<meta property='og:image:height' content='630'>
<meta property='og:image:alt' content='{{ og_image_alt | default: site.ogImageAlt | escape }}'>
<meta name='twitter:card' content='summary_large_image'>
<meta name='twitter:title' content='{{ title | default: site.homepage_title | escape }}'>
<meta name='twitter:description' content='{{ description | default: site.description_long | escape }}'>
<meta name='twitter:image' content='{{ site.url }}{{ og_image | default: site.ogImage }}'>
{% unless isLocalPreview %}
  <script src='https://analytics.ahrefs.com/analytics.js' data-key='nXXk1y0Fw22OT7lRCMDrYA' async></script>
{% endunless %}
