<section id='munkak' class='section work home-gallery' aria-labelledby='work-title'>
  <div class='container'>
    <div class='section-heading'>
      <h2 id='work-title'>Saját munkák</h2>
      <p class='home-work__lead'>
        Saját fotók az elkészült autókról. A képekre kattintva nagyobb méretben is körülnézhetsz.
      </p>
    </div>
    <div class='work__grid home-gallery__grid'>
      {% for photo in gallery %}
        <figure>
          <a
            class='home-gallery__open'
            href='{{ photo.large }}'
            data-gallery-index='{{ forloop.index0 }}'
            aria-label='{{ photo.caption | escape }}, kép nagyítása'
            ><img
              src='{{ photo.src }}'
              width='{{ photo.width }}'
              height='{{ photo.height }}'
              alt='{{ photo.alt | escape }}'
              loading='lazy'
              decoding='async'
          ></a>
          <figcaption>
            <strong class='gallery-title'>{{ photo.caption | escape }}</strong>
            <p class='gallery-description'>{{ photo.description | escape }}</p>
          </figcaption>
        </figure>
      {% endfor %}
    </div>
  </div>
  {% include 'gallery-viewer.html' %}
</section>
